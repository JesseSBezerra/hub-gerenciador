<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Tarefas</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        .header-col-a {
            background-color: #808080;
            color: white;
            font-weight: bold;
        }
        .header-col-b {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        .header-col-c {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        .semana-marcada {
            background-color: #FFC7CE;
        }
        .semana-vazia {
            background-color: #FFFFFF;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th class="header-col-a">HISTORIA</th>
                <th class="header-col-b">TAREFA</th>
                <th class="header-col-c">RESP</th>
                <th>S1</th>
                <th>S2</th>
                <th>S3</th>
                <th>S4</th>
            </tr>
        </thead>
        <tbody>
            <!-- Mensagem quando não há dados -->
            <tr th:if="${#lists.isEmpty(report.historias)}">
                <td colspan="7" style="text-align: center; padding: 20px;">
                    Nenhuma tarefa encontrada nesta sprint. Adicione tarefas à sprint usando o endpoint /api/sprint-items
                </td>
            </tr>
            
            <th:block th:each="historia, historiaIter : ${report.historias}">
                <!-- Caso a historia não tenha subtarefas -->
                <tr th:if="${#lists.isEmpty(historia.subtarefas)}">
                    <td th:text="${historia.historiaNome}"></td>
                    <td colspan="6" style="text-align: center;">Sem subtarefas</td>
                </tr>
                
                <th:block th:each="tarefa, tarefaIter : ${historia.subtarefas}">
                    <th:block th:if="${!#lists.isEmpty(tarefa.responsaveis)}">
                        <tr th:each="resp, respStat : ${tarefa.responsaveis}">
                            <!-- HISTORIA - rowspan para todas as linhas desta historia -->
                            <td th:if="${tarefaIter.first && respStat.first}" 
                                th:rowspan="${#aggregates.sum(historia.subtarefas.![responsaveis.size()])}"
                                th:text="${historia.historiaNome}"></td>
                            
                            <!-- TAREFA - rowspan para todos os responsáveis desta tarefa -->
                            <td th:if="${respStat.first}" 
                                th:rowspan="${#lists.size(tarefa.responsaveis)}"
                                th:text="${tarefa.nomeTarefa}"></td>
                            
                            <!-- RESP - uma linha por responsável -->
                            <td th:text="${resp}"></td>
                            
                            <!-- Semanas - rowspan para todos os responsáveis desta tarefa -->
                            <td th:if="${respStat.first}" 
                                th:rowspan="${#lists.size(tarefa.responsaveis)}"
                                th:class="${tarefa.semana1} ? 'semana-marcada' : 'semana-vazia'"></td>
                            <td th:if="${respStat.first}" 
                                th:rowspan="${#lists.size(tarefa.responsaveis)}"
                                th:class="${tarefa.semana2} ? 'semana-marcada' : 'semana-vazia'"></td>
                            <td th:if="${respStat.first}" 
                                th:rowspan="${#lists.size(tarefa.responsaveis)}"
                                th:class="${tarefa.semana3} ? 'semana-marcada' : 'semana-vazia'"></td>
                            <td th:if="${respStat.first}" 
                                th:rowspan="${#lists.size(tarefa.responsaveis)}"
                                th:class="${tarefa.semana4} ? 'semana-marcada' : 'semana-vazia'"></td>
                        </tr>
                    </th:block>
                    
                    <!-- Caso a tarefa não tenha responsáveis -->
                    <tr th:if="${#lists.isEmpty(tarefa.responsaveis)}">
                        <td th:if="${tarefaIter.first}" 
                            th:rowspan="${#lists.size(historia.subtarefas)}"
                            th:text="${historia.historiaNome}"></td>
                        <td th:text="${tarefa.nomeTarefa}"></td>
                        <td>-</td>
                        <td th:class="${tarefa.semana1} ? 'semana-marcada' : 'semana-vazia'"></td>
                        <td th:class="${tarefa.semana2} ? 'semana-marcada' : 'semana-vazia'"></td>
                        <td th:class="${tarefa.semana3} ? 'semana-marcada' : 'semana-vazia'"></td>
                        <td th:class="${tarefa.semana4} ? 'semana-marcada' : 'semana-vazia'"></td>
                    </tr>
                </th:block>
            </th:block>
        </tbody>
    </table>
</body>
</html>
