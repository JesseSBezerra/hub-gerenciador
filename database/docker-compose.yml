version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gerenciador-postgres
    environment:
      POSTGRES_DB: gerenciador
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gerenciador-network

volumes:
  postgres_data:

networks:
  gerenciador-network:
    driver: bridge
